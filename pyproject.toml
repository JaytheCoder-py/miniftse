[project]
name = "miniftse"
version = "0.1.0"
description = "A rules-based equity index engine, built as a training platform for index research & design"
readme = "README.md"
authors = [
    { name = "jason", email = "jaythecoder.py@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "polars>=1.43.2",
    "pyarrow>=25.0.0",
    "requests>=2.34.2",
    "scipy>=1.18.0",
    "statsmodels>=0.14.6",
    "yfinance>=1.5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "hypothesis>=6.165.2",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.mypy]
strict = true
files = ["src/miniftse"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
