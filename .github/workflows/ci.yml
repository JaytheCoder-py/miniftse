name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    # Nightly rebuild. An index platform that only runs when someone pushes will
    # discover a dependency break on the morning it matters.
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fixed so a run is reproducible. Python randomises string hashing by default, and
  # this repo has already been bitten once by an RNG seeded from hash() - a golden
  # master caught 5.3bp of drift between two supposedly identical builds.
  PYTHONHASHSEED: "0"

jobs:
  lint:
    name: lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev
      - name: ruff
        run: uv run ruff check src tests
      - name: ruff format
        run: uv run ruff format --check src tests
      - name: mypy
        run: uv run mypy src/miniftse

  test:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --all-extras --dev
      - name: unit and property tests
        run: uv run pytest tests/ -q --cov=miniftse --cov-report=term-missing --cov-report=xml
      - name: coverage gate
        run: uv run coverage report --fail-under=70
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.python }}
          path: coverage.xml

  golden-master:
    name: golden master
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev
      - name: rebuild and compare against the pinned index history
        # The most important check in the pipeline. Everything else verifies that the
        # code does what its author meant; this verifies that ten years of published
        # numbers have not moved. A refactor that shifts the index by half a basis
        # point is a recalculation event, not a tidy-up.
        run: uv run miniftse check-golden

  quality:
    name: chaos drill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev
      - name: inject faults and measure validation coverage
        run: uv run miniftse chaos-drill --securities 150

  ai-evals:
    name: methodology assistant evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev
      - name: run the eval suite offline
        # Runs against the deterministic offline backend, so it needs no API key and
        # no spend. What it measures is the scaffolding - retrieval, citation,
        # abstention, the number guard - which is where RAG systems actually fail.
        run: uv run pytest tests/test_integration.py::TestAiLayer -q

  build:
    name: package and container
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - name: docker build
        run: docker build -t miniftse:${{ github.sha }} .
      - name: smoke test the image
        run: |
          docker run --rm miniftse:${{ github.sha }} \
            miniftse build-index --securities 60 --start 2016-01-04 --end 2017-12-29

  nightly-alert:
    name: open an issue if the nightly run fails
    runs-on: ubuntu-latest
    needs: [test, golden-master, quality]
    if: failure() && github.event_name == 'schedule'
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = `Nightly index build failed (${new Date().toISOString().slice(0,10)})`;
            const body = [
              'The scheduled nightly build failed.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Runbook: `docs/RUNBOOK.md` — "What to do when the 6am index calculation fails".',
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'nightly-failure',
            });
            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['nightly-failure', 'incident'],
              });
            }
