name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    # Nightly rebuild. An index platform that only runs when someone pushes will
    # discover a dependency break on the morning it matters.
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fixed so a run is reproducible. Python randomises string hashing by default, and
  # this repo has already been bitten once by an RNG seeded from hash() - a golden
  # master caught 5.3bp of drift between two supposedly identical builds.
  PYTHONHASHSEED: "0"

jobs:
  lint:
    name: lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev
      - name: ruff
        run: uv run ruff check src tests
      - name: ruff format
        run: uv run ruff format --check src tests
      - name: mypy
        run: uv run mypy src/miniftse

  test:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --all-extras --dev
      - name: unit and property tests
        run: uv run pytest tests/ -q --cov=miniftse --cov-report=term-missing --cov-report=xml
      - name: coverage gate
        run: uv run coverage report --fail-under=70
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.python }}
          path: coverage.xml

  golden-master:
    name: golden master
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev
      - name: rebuild and compare against the pinned index history
        # The most important check in the pipeline. Everything else verifies that the
        # code does what its author meant; this verifies that ten years of published
        # numbers have not moved. A refactor that shifts the index by half a basis
        # point is a recalculation event, not a tidy-up.
        #
        # This job runs on Linux. The banding fix (27502f6, "band assignment must not
        # depend on floating-point summation order") was developed and re-pinned
        # (ff73906) on Windows, where the platform-dependent `np.cumsum` bug that
        # motivated it was actually found - Task 11's local golden check could not by
        # itself prove the fix holds cross-platform. This is that proof: the first time
        # the post-fix master is checked against a from-scratch rebuild on a different
        # OS.
        run: uv run miniftse check-golden

  quality:
    name: chaos drill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev
      - name: inject faults and measure validation coverage
        run: uv run miniftse chaos-drill --securities 150

  ai-evals:
    name: methodology assistant evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev
      - name: run the eval suite offline
        # Runs against the deterministic offline backend, so it needs no API key and
        # no spend. What it measures is the scaffolding - retrieval, citation,
        # abstention, the number guard - which is where RAG systems actually fail.
        run: uv run pytest tests/test_integration.py::TestAiLayer -q

  desk-snapshot:
    name: desk snapshot smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev
      - name: build a small snapshot end to end
        # 100 securities over one year, not the 300-security/nine-year reference build
        # `desk/data/` is committed from - this job exists to catch a change that
        # breaks snapshot generation (an EXPECTED_FILES artefact stops being written,
        # a helper starts raising on this shape of data) in CI, before it breaks a
        # deploy. It does not need to match the golden master to prove that.
        run: |
          uv run miniftse desk-snapshot --out /tmp/desk-smoke --securities 100 \
            --start 2019-01-02 --end 2019-12-31

  build:
    name: package and container
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - name: docker build
        # `--target runtime`: the Dockerfile's last stage is now `desk` (Task 14), so a
        # plain `docker build .` would build the ops-desk image instead of the index
        # builder this job has always smoke-tested. Pinning the target keeps this job
        # testing what it always tested; the desk image has no docker-based CI check of
        # its own; the `desk-snapshot` job above is the check for its build step.
        run: docker build --target runtime -t miniftse:${{ github.sha }} .
      - name: smoke test the image
        run: |
          docker run --rm miniftse:${{ github.sha }} \
            miniftse build-index --securities 60 --start 2016-01-04 --end 2017-12-29

  nightly-alert:
    name: open an issue if the nightly run fails
    runs-on: ubuntu-latest
    needs: [test, golden-master, quality]
    if: failure() && github.event_name == 'schedule'
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = `Nightly index build failed (${new Date().toISOString().slice(0,10)})`;
            const body = [
              'The scheduled nightly build failed.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Runbook: `docs/RUNBOOK.md` — "What to do when the 6am index calculation fails".',
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'nightly-failure',
            });
            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['nightly-failure', 'incident'],
              });
            }
